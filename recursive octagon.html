<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 0; background: black; overflow: hidden; }
    #ui {
      position: absolute; top: 20px; left: 20px; color: white;
      font-family: monospace; font-size: 14px; line-height: 2; z-index: 10;
    }
    #ui input { width: 220px; display: block; margin-top: 4px; }
    #defect-display {
      position: absolute; top: 20px; right: 20px; color: white;
      font-family: monospace; font-size: 13px; text-align: right;
      line-height: 1.8; z-index: 10;
    }
    #debug {
      position: absolute; bottom: 20px; left: 20px; color: #666;
      font-family: monospace; font-size: 11px; line-height: 1.6; z-index: 10;
    }
  </style>
</head>
<body>

<div id="ui">
  r = <span id="r-display">0.611</span>
  <input type="range" id="r-slider" min="0.30" max="0.97" step="0.001" value="0.611">
  r_critical = 0.7654 (= √(2−√2))
  <br>status: <span id="status">—</span>
</div>

<div id="defect-display">
  angle defect K_v = <span id="kv-display">—</span> rad<br>
  angle sum at v = <span id="anglesum-display">—</span> rad<br>
  |r − r_critical| = <span id="delta-display">—</span><br>
  regime: <span id="regime-display">—</span>
</div>

<div id="debug">
  faces at rep. vertex: <span id="facecount">—</span> &nbsp;|&nbsp;
  max |z|: <span id="maxz">—</span> px
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script>

const N_SIDES  = 8;
const N_LAYERS = 9;
const R_CRIT   = Math.sqrt(2 - Math.sqrt(2));
const R0       = 185;

let r = 0.611;

let vertices = [];
let edges    = [];
let faces    = [];
let layerIdx = [];

let autoAngle     = 0;
let transitioning = false;
let targetZ       = [];

// ── geometry helpers ──────────────────────────────────────────────────────────

function intersect2D(p1, p2, p3, p4) {
  let d1x=p2.x-p1.x, d1y=p2.y-p1.y;
  let d2x=p4.x-p3.x, d2y=p4.y-p3.y;
  let den = d1x*d2y - d1y*d2x;
  if (Math.abs(den) < 1e-12) return null;
  let t = ((p3.x-p1.x)*d2y - (p3.y-p1.y)*d2x) / den;
  return { x: p1.x+t*d1x, y: p1.y+t*d1y };
}

function buildLayerPts(rr) {
  let pts = [];
  pts[0] = [];
  for (let i = 0; i < N_SIDES; i++) {
    let a = 2*Math.PI*i/N_SIDES;
    pts[0].push({ x: R0*Math.cos(a), y: R0*Math.sin(a) });
  }
  for (let k = 0; k < N_LAYERS-1; k++) {
    let raw = [];
    for (let i = 0; i < N_SIDES; i++) {
      let p = intersect2D(
        pts[k][i],             pts[k][(i+2)%N_SIDES],
        pts[k][(i+1)%N_SIDES], pts[k][(i+3)%N_SIDES]
      );
      raw.push(p || {x:0,y:0});
    }
    let rawR = Math.sqrt(raw[0].x**2 + raw[0].y**2);
    if (rawR < 1e-8) rawR = 1e-8;
    let sc = (R0 * Math.pow(rr, k+1)) / rawR;
    pts[k+1] = raw.map(p => ({ x: p.x*sc, y: p.y*sc }));
  }
  return pts;
}

// ── graph generation ──────────────────────────────────────────────────────────

function generateGraph() {
  vertices = []; edges = []; faces = []; layerIdx = [];

  let layerPts = buildLayerPts(r);

  for (let k = 0; k < N_LAYERS; k++) {
    layerIdx[k] = [];
    for (let i = 0; i < N_SIDES; i++) {
      layerIdx[k][i] = vertices.length;
      vertices.push({ x: layerPts[k][i].x, y: layerPts[k][i].y, z: 0 });
    }
  }

  for (let k = 0; k < N_LAYERS; k++)
    for (let i = 0; i < N_SIDES; i++)
      edges.push([layerIdx[k][i], layerIdx[k][(i+1)%N_SIDES]]);

  for (let k = 0; k < N_LAYERS-1; k++) {
    for (let i = 0; i < N_SIDES; i++) {
      edges.push([layerIdx[k][i],   layerIdx[k+1][(i-1+N_SIDES)%N_SIDES]]);
      edges.push([layerIdx[k+1][i], layerIdx[k][(i+2)%N_SIDES]]);
    }
  }

  for (let k = 0; k < N_LAYERS-1; k++) {
    for (let i = 0; i < N_SIDES; i++) {
      let vIdx = layerIdx[k+1][i];
      let vx = vertices[vIdx].x, vy = vertices[vIdx].y;

      let nbrs = [
        layerIdx[k][ i],
        layerIdx[k][(i+2)%N_SIDES],
        layerIdx[k][(i+1)%N_SIDES],
        layerIdx[k][(i+3)%N_SIDES],
      ];

      if (k+2 < N_LAYERS) {
        nbrs.push(layerIdx[k+2][ i]);
        nbrs.push(layerIdx[k+2][(i-1+N_SIDES)%N_SIDES]);
      } else {
        nbrs.push(layerIdx[k+1][(i+1)%N_SIDES]);
        nbrs.push(layerIdx[k+1][(i-1+N_SIDES)%N_SIDES]);
      }

      let sorted = nbrs.map(nIdx => ({
        idx:   nIdx,
        angle: Math.atan2(vertices[nIdx].y - vy, vertices[nIdx].x - vx)
      })).sort((a,b) => a.angle - b.angle);

      for (let s = 0; s < 6; s++)
        faces.push([vIdx, sorted[s].idx, sorted[(s+1)%6].idx]);
    }
  }
}

// ── angle defect ──────────────────────────────────────────────────────────────

function flatAngleAt(vIdx, aIdx, bIdx) {
  let vx=vertices[vIdx].x, vy=vertices[vIdx].y;
  let ax=vertices[aIdx].x-vx, ay=vertices[aIdx].y-vy;
  let bx=vertices[bIdx].x-vx, by=vertices[bIdx].y-vy;
  let ma=Math.sqrt(ax*ax+ay*ay), mb=Math.sqrt(bx*bx+by*by);
  if (ma<1e-10||mb<1e-10) return 0;
  return Math.acos(Math.max(-1,Math.min(1,(ax*bx+ay*by)/(ma*mb))));
}

function computeAngleDefect() {
  if (!layerIdx[1] || faces.length===0) return 0;
  let vIdx = layerIdx[1][0];
  let total = 0, count = 0;
  for (let f of faces) {
    if (f[0] !== vIdx) continue;
    total += flatAngleAt(f[0], f[1], f[2]);
    count++;
  }
  document.getElementById('facecount').textContent = count;
  return 2*Math.PI - total;
}

// ── spring-network embedding ──────────────────────────────────────────────────

function computeEmbedding() {
  for (let v of vertices) v.z = 0;

  let pinned = new Set();
  for (let i=0; i<N_SIDES; i++) pinned.add(layerIdx[0][i]);

  let canonPts = buildLayerPts(R_CRIT);
  let canonPos  = new Array(vertices.length);
  for (let k=0; k<N_LAYERS; k++)
    for (let i=0; i<N_SIDES; i++)
      canonPos[layerIdx[k][i]] = canonPts[k][i];

  let baseRestL = edges.map(([i,j]) => {
    let ci=canonPos[i], cj=canonPos[j];
    if (!ci||!cj) return 1;
    return Math.sqrt((ci.x-cj.x)**2 + (ci.y-cj.y)**2);
  });

  let Kv = computeAngleDefect();

  // ── REST LENGTHS ─────────────────────────────────────────────────────────
  // Key insight: to get dramatic buckling we need to encode the intrinsic
  // curvature stress as aggressively as possible into the spring network.
  //
  // For the saddle (K_v < 0), we split the amplification strategy by edge type:
  //   - Ring edges: SHORTEN significantly (the disk has a deficit of material,
  //     so circumferences want to compress → drives saddle ripple)
  //   - Strut edges: LENGTHEN slightly (struts are under tension in the saddle,
  //     pulling the inner rings outward and amplifying the ripple amplitude)
  // This tug-of-war between shortened rings and lengthened struts forces much
  // larger z-displacement than scaling all edges uniformly.
  //
  // For the cone (K_v > 0) we keep the original approach but push amplify higher.

  let nRingEdges = N_SIDES * N_LAYERS;
  let ampConeRing   = 2.5;
  let ampSaddleRing = 9.0;   // very aggressive ring shortening for saddle
  let ampSaddleStrut = 2.0;  // strut lengthening pulls the saddle outward

  let restL = baseRestL.map((L, e) => {
    let isRing = e < nRingEdges;
    if (Kv >= 0) {
      return isRing ? L * (1 + ampConeRing * Kv) : L;
    } else {
      if (isRing) return L * (1 + ampSaddleRing  *  Kv);   // Kv<0 → shorter
      else        return L * (1 - ampSaddleStrut  *  Kv);   // Kv<0, neg→ longer
    }
  });

  // ── INITIAL Z SEED ────────────────────────────────────────────────────────
  // Superpose two saddle modes to break symmetry more aggressively:
  //   Primary:   sin(4θ)  — the canonical 4-lobe mode (zero at boundary)
  //   Secondary: sin(2θ)  — adds asymmetry between adjacent lobes
  //
  // For the cone, a large uniform dome seed with a small sin(1θ) tilt so
  // gradient descent doesn't stall on the perfectly symmetric flat saddle.
  //
  // Amplitude is now cubic in |K_v| for small K_v and linear for large K_v,
  // achieved via |K_v|^0.5 which grows faster than linear near zero.

  let nudgeAmpCone   = Math.pow(Math.abs(Kv), 0.5) * 320;
  let nudgeAmpSaddle = Math.pow(Math.abs(Kv), 0.4) * 2800;

  for (let k = 1; k < N_LAYERS; k++) {
    let radFracInward = k / (N_LAYERS - 1);   // 0 at outer ring, 1 at centre
    let radFracOutward= 1 - radFracInward;

    for (let i = 0; i < N_SIDES; i++) {
      let vIdx = layerIdx[k][i];
      let θ = 2 * Math.PI * i / N_SIDES;

      let z;
      if (Kv >= 0) {
        // Cone: dome shape, taller at centre
        z = nudgeAmpCone * radFracInward
          + nudgeAmpCone * 0.15 * Math.sin(θ);   // tiny tilt to break symmetry
      } else {
        // Saddle: superposition of sin(4θ) and sin(2θ) modes.
        // Inner layers have more excess length to shed → larger amplitude inward.
        // sin(4θ): primary 4-lobe saddle, zero at boundary vertices.
        // sin(2θ): secondary mode, breaks the 4-fold degeneracy slightly.
        let primary   = Math.sin(4 * θ);
        let secondary = Math.sin(2 * θ) * 0.4;
        z = nudgeAmpSaddle * radFracInward * (primary + secondary);
      }

      vertices[vIdx].z = z + (Math.random() - 0.5) * 2.0;
    }
  }

  // ── GRADIENT DESCENT ─────────────────────────────────────────────────────
  // Two-phase solver for the saddle:
  //   Phase 1 (coarse): high LR to rapidly escape the flat region
  //   Phase 2 (fine):   lower LR to settle into a clean minimum
  // For the cone, a single phase suffices (energy landscape is convex-ish).

  if (Kv >= 0) {
    // Single phase
    let lr = 0.006, iters = 5000;
    runGD(lr, iters, pinned, restL);
  } else {
    // Phase 1: escape flat region fast
    runGD(0.012, 3000, pinned, restL);
    // Phase 2: refine
    runGD(0.004, 6000, pinned, restL);
  }
}

function runGD(lr, iters, pinned, restL) {
  for (let it=0; it<iters; it++) {
    let gz = new Array(vertices.length).fill(0);
    for (let e=0; e<edges.length; e++) {
      let [vi,vj] = edges[e];
      let dx=vertices[vi].x-vertices[vj].x;
      let dy=vertices[vi].y-vertices[vj].y;
      let dz=vertices[vi].z-vertices[vj].z;
      let L = Math.sqrt(dx*dx+dy*dy+dz*dz);
      if (L<1e-8) continue;
      let stretch = (L - restL[e]) / L;
      gz[vi] += 2*stretch*dz;
      gz[vj] -= 2*stretch*dz;
    }
    for (let vi=0; vi<vertices.length; vi++) {
      if (!pinned.has(vi)) vertices[vi].z -= lr*gz[vi];
    }
  }
}

// ── p5 sketch ─────────────────────────────────────────────────────────────────

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);
  generateGraph();
  computeEmbedding();
  targetZ = vertices.map(v => v.z);
  updateUI();

  document.getElementById('r-slider').addEventListener('input', function() {
    r = parseFloat(this.value);
    document.getElementById('r-display').textContent = r.toFixed(3);
    let oldZ = vertices.map(v => v.z);
    generateGraph();
    computeEmbedding();
    targetZ = vertices.map(v => v.z);
    for (let i=0; i<vertices.length; i++)
      vertices[i].z = (i<oldZ.length) ? oldZ[i] : 0;
    transitioning = true;
    updateUI();
  });
}

function updateUI() {
  let Kv    = computeAngleDefect();
  let delta = Math.abs(r - R_CRIT);
  let angleSum = 2*Math.PI - Kv;
  let status, regime;
  if (delta < 0.004) {
    status = 'FLAT  (r ≈ r_critical, K_v ≈ 0)';
    regime = 'flat embedding possible';
  } else if (r < R_CRIT) {
    status = 'BUCKLED  (r < r_critical)';
    regime = 'K_v > 0  →  positive curvature (cone-like)';
  } else {
    status = 'BUCKLED  (r > r_critical)';
    regime = 'K_v < 0  →  negative curvature (saddle-like)';
  }
  document.getElementById('status').textContent          = status;
  document.getElementById('kv-display').textContent      = Kv.toFixed(5);
  document.getElementById('anglesum-display').textContent= angleSum.toFixed(5);
  document.getElementById('delta-display').textContent   = delta.toFixed(5);
  document.getElementById('regime-display').textContent  = regime;
}

function draw() {
  background(0);
  autoAngle += 0.003;
  rotateX(0.38);
  rotateY(autoAngle);
  orbitControl();

  if (transitioning) {
    let done = true;
    for (let i=0; i<vertices.length && i<targetZ.length; i++) {
      vertices[i].z += 0.08*(targetZ[i]-vertices[i].z);
      if (Math.abs(targetZ[i]-vertices[i].z) > 0.5) done = false;
    }
    if (done) transitioning = false;
  }

  let maxZ = 1;
  for (let v of vertices) if (Math.abs(v.z) > maxZ) maxZ = Math.abs(v.z);
  document.getElementById('maxz').textContent = maxZ.toFixed(1);

  strokeWeight(1.3); noFill();
  for (let [i,j] of edges) {
    if (i>=vertices.length||j>=vertices.length) continue;
    let v1=vertices[i], v2=vertices[j];
    let t = constrain((Math.abs(v1.z)+Math.abs(v2.z))*0.5/maxZ, 0, 1);
    stroke(lerp(210,80,t), lerp(175,120,t), lerp(110,255,t));
    line(v1.x,v1.y,v1.z, v2.x,v2.y,v2.z);
  }

  noStroke();
  for (let v of vertices) {
    let t = constrain(Math.abs(v.z)/maxZ, 0, 1);
    fill(lerp(210,80,t), lerp(175,120,t), lerp(110,255,t));
    push(); translate(v.x,v.y,v.z); sphere(2.5); pop();
  }
}

function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>
